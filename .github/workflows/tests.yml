name: Run Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: Check out code
        uses: actions/checkout@v7
      - name: Run tests
        run: go test ./...
